<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>黑暗森林 · 上帝视角V5 (缩圈机制)</title>
    <style>
        body{background:#050505;color:#ccc;font-family:"Courier New",monospace;margin:0;display:flex;height:100vh;overflow:hidden;user-select:none}
        #map{flex:2;position:relative;border-right:1px solid #333;background:radial-gradient(circle,#0a0a0a,#000);cursor:grab}
        #map.dragging{cursor:grabbing}
        canvas{display:block}
        #side{flex:1;min-width:360px;max-width:460px;display:flex;flex-direction:column;padding:15px;box-sizing:border-box}
        h1{color:#f00;font-size:18px;margin:0 0 10px;text-shadow:0 0 5px rgba(255,0,0,.5)}
        .btns{display:flex;gap:10px;margin-bottom:10px}
        button{background:#222;color:#f00;border:1px solid #f00;padding:8px 15px;cursor:pointer;font-family:inherit;font-size:14px;flex:1;transition:.2s}
        button:hover{background:#f00;color:#000}
        button.on{background:#f00;color:#000;box-shadow:0 0 8px rgba(255,0,0,.6)}
        #stats{font-size:12px;color:#888;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
        #log{flex:1;border:1px solid #333;overflow-y:auto;padding:10px;font-size:12px;line-height:1.5;background:#000;white-space:pre-wrap}
        .l-bat{color:#fa0}.l-die{color:#f00;font-weight:bold}.l-god{color:#ff0;text-shadow:0 0 3px #ff0}.l-lvl{color:#0f0}.l-zone{color:#f44;font-style:italic}
        #tip{position:absolute;background:rgba(0,0,0,.95);border:1px solid #555;padding:8px;font-size:12px;pointer-events:none;display:none;z-index:10;white-space:pre-line}
        .hint{position:absolute;bottom:10px;left:10px;font-size:11px;color:#444;pointer-events:none}
    </style>
</head>
<body>
<div id="map">
    <canvas id="c"></canvas>
    <div id="tip"></div>
    <div class="hint">🖱️ 滚轮缩放 | 左键拖拽 | 悬停查看文明</div>
</div>
<div id="side">
    <h1>🌌 黑暗森林·上帝视角V5</h1>
    <div class="btns">
        <button id="bStart" onclick="toggle()">▶️ 启动演化</button>
        <button onclick="reset()">🔄 重启宇宙</button>
    </div>
    <div id="stats">回合:0 | 存活:0 | 安全区:100%</div>
    <div id="log"><span style="color:#888">>>> V5引擎就绪。缩圈机制已激活...</span></div>
</div>

<script>
/**
 * ==========================================
 * ⚙️ 黑暗森林 V5: 完整缩圈 + 力导向 + 视口控制
 * ==========================================
 */
const N = 80, P = 200, KCD = Math.floor(P/N);
const MAX_EPOCH = 100; // 总回合数
const DIE = [0,5,10,30,120,600,3600,25200,100800,1000000,36000000,-Infinity];

let canvas,ctx,W,H;
let civs=[], gods=[], battles={}, space={};
let fa=[], vis=[], adj=[], nodeActive=[];
let epoch=0, timer=null, running=false, countCiv=N;
let safeRadius = 1.0; // 当前安全区半径比例 (1.0 -> 0.0)

// === 视口状态 ===
let cam = {x:0, y:0, zoom:1};
let drag = {active:false, sx:0, sy:0, cx:0, cy:0};
let nodePos = {}; 

// --- 工具函数 ---
function getfa(x){return fa[x]===x?x:fa[x]=getfa(fa[x]);}
function randInt(n){return n<=0?0:Math.floor(Math.random()*n)+1;}
function dist2d(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

// --- 地图生成 & 缩圈初始化 ---
function buildMap(civCount, extraEdges){
    const total=P*2;
    fa=Array.from({length:total},(_,i)=>i);
    adj=Array.from({length:total},()=>[]);
    vis=new Array(total).fill(0);
    nodeActive=new Array(total).fill(true); // ✅ 新增：节点是否在安全区内
    
    for(let i=1;i<total;i++){if(battles[i])continue;adj[i].push(0);adj[0].push(i);}
    let cnt=total-2-Object.keys(battles).length;
    while(cnt>0){
        let x=randInt(total-1),y=randInt(total-1);
        if(x===y||battles[x]||battles[y]||!nodeActive[x]||!nodeActive[y])continue;
        if(getfa(x)!==getfa(y)){fa[getfa(x)]=getfa(y);adj[x].push(y);adj[y].push(x);cnt--;}
    }
    for(let i=0;i<extraEdges;i++){
        let x=randInt(total-1),y=randInt(total-1);
        if(nodeActive[x]&&nodeActive[y]){adj[x].push(y);adj[y].push(x);}
    }
}

// ✅ 缩圈核心逻辑：每回合更新安全区，驱逐边界文明
function updateSafeZone(){
    // 线性收缩：从1.0匀速缩到0.1
    safeRadius = Math.max(0.1, 1.0 - (epoch / MAX_EPOCH) * 0.9);
    
    // 标记超出安全区的节点为不可用
    let deactivated = 0;
    for(let i=0; i<nodePos.length; i++){
        if(!nodePos[i]) continue;
        const d = Math.sqrt(nodePos[i].x**2 + nodePos[i].y**2);
        if(d > safeRadius && nodeActive[i]){
            nodeActive[i] = false;
            deactivated++;
        }
    }
    
    // 强制迁移：将处于危险区的文明传送到安全区随机节点
    for(let i=1;i<=N;i++){
        if(!civs[i].alive) continue;
        const pos = nodePos[civs[i].dir];
        if(pos && !nodeActive[civs[i].dir]){
            // 寻找安全区内随机节点
            let safeNodes = [];
            for(let j=0;j<nodePos.length;j++){
                if(nodeActive[j] && !vis[j]) safeNodes.push(j);
            }
            if(safeNodes.length > 0){
                const newNode = safeNodes[randInt(safeNodes.length)-1];
                vis[civs[i].dir] = 0;
                civs[i].dir = newNode;
                vis[newNode] = i;
                log(`⚠️ 文明${i}被缩圈驱逐至安全区！`,'l-zone');
            } else {
                // 安全区满了？直接淘汰
                killCiv(i);
                log(`💀 文明${i}因无处可逃被缩圈吞噬！`,'l-die');
            }
        }
    }
    
    if(deactivated > 0) log(`🔴 安全区收缩！${deactivated}个节点坠入虚空...`,'l-zone');
}

// --- 伤害 & 战斗 (与V4一致) ---
function calcDmg(x,y){return civs[x].level*civs[x].level*civs[x].tec*civs[x].neword/(civs[y].level*civs[y].level*civs[y].tec*civs[y].shield);}
function calcDmg2(x,y){return civs[x].neword*Math.max(civs[x].kill,1)*randInt(5)*0.1/(civs[y].neword/Math.max(civs[y].kill,1)/civs[y].shield);}
function killCiv(id){civs[id].alive=false;vis[civs[id].dir]=0;countCiv--;}

function war(x,y){
    if(!civs[x].alive||!civs[y].alive)return 0;
    const ax=civs[x],ay=civs[y];let w,l;
    if(ax.level!==ay.level){
        w=ax.level>ay.level?x:y;l=w===x?y:x;
        civs[l].tec*=randInt(8)*0.1+1.2;civs[w].kill++;killCiv(l);
        civs[w].wei-=calcDmg(l,w)*civs[l].wei;
        if(civs[w].wei<=0){log(`文明${w}与${l}同归于尽！`,'l-die');civs[l].kill++;killCiv(w);return -2;}
        log(`高维文明${w}抹杀了低维文明${l}!`,'l-bat');return w===x?1:2;
    }
    let round=ax.level*ax.level;
    while(round-->0){
        let wx=ax.wei;ax.wei-=calcDmg(y,x)*ay.wei;
        if(ax.wei<DIE[ax.level])ay.wei-=calcDmg(x,y)*wx*(randInt(10)*0.01+0.1);
        else ay.wei-=calcDmg(x,y)*wx;
        w=ax.neword>ay.neword?x:y;l=w===x?y:x;
        civs[l].neword-=calcDmg2(w,l);civs[w].neword-=calcDmg2(l,w);
        if(isNaN(ax.wei)||isNaN(ay.wei)||isNaN(ax.neword)||isNaN(ay.neword)){
            log(`文明${x}与${y}法则坍缩！`,'l-die');killCiv(x);killCiv(y);return -2;}
        if(ax.wei<DIE[ax.level]){killCiv(x);if(ay.wei<DIE[ax.level]){log(`${x}与${y}同归于尽！`,'l-die');killCiv(y);return -2;}log(`${y}抹杀${x}！`,'l-die');return 2;}
        if(ay.wei<DIE[ax.level]){log(`${x}抹杀${y}！`,'l-die');killCiv(y);return 1;}
        if(ax.neword<ax.ord*randInt(20)*0.01){log(`${x}内乱毁灭！`,'l-die');killCiv(x);return 2;}
        if(ay.neword<ay.ord*randInt(36)*0.01){log(`${y}内乱毁灭！`,'l-die');killCiv(y);return 1;}
    }
    return -1;
}

// --- 核心演化循环 ---
function tick(){
    epoch++;
    if(epoch>=MAX_EPOCH || countCiv<=1){
        stop();
        log(epoch>=MAX_EPOCH?`\n⏳ 时间尽头！剩余${countCiv}个文明幸存`:`\n👑 唯一幸存者诞生！`,'l-god');
        return;
    }
    
    // ✅ 先执行缩圈！
    updateSafeZone();
    
    buildMap(countCiv*KCD, countCiv*KCD*randInt(3));
    let nit=1;
    for(let i=1;i<=N;i++){
        if(civs[i].alive && nodeActive[civs[i].dir]){
            civs[i].dir = nit*KCD + randInt(KCD)-1;
            vis[civs[i].dir]=i; nit++;
        }
    }
    
    // 移动+战斗 (仅允许在安全区内移动)
    for(let i=1;i<=N;i++){
        if(!civs[i].alive) continue;
        vis[civs[i].dir]=0;
        let step=civs[i].level, x=civs[i].dir, maxk=0;
        while(step-->0){
            let next=x, retry=0;
            do { 
                const neighbors = adj[x].filter(nb => nodeActive[nb]); // ✅ 只走安全区节点
                if(neighbors.length===0) break;
                next=neighbors[randInt(neighbors.length)-1]; retry++; 
            } while(next===civs[i].dir && retry<20);
            if(retry>=20 || !nodeActive[next]) break;
            x=next;
            if(space[x]){let keys=Object.keys(battles).map(Number).filter(k=>nodeActive[k]);x=keys[randInt(keys.length)-1]||0;}
            if(vis[x]){
                let enemy=vis[x];
                if(Math.abs(civs[enemy].level-civs[i].level)>=3) continue;
                let win=war(enemy,i);
                if(win!==-1&&x!==0&&!battles[x]) space[x]=1;
                if(win===-2){if(!battles[x])for(let j in battles){if(j==0)continue;adj[j].push(x);adj[x].push(j);}if(!battles[x])battles[x]=[];battles[x].push([enemy,i]);}
                if(win===2){civs[i].wei+=civs[enemy].wei*civs[enemy].neword*civs[enemy].level/civs[i].level*(randInt(10)*0.01+0.1)*civs[i].tec;civs[i].tec+=civs[enemy].tec*civs[enemy].level*(randInt(20)*0.01+0.3)/civs[i].tec;maxk++;}
                else if(win===1){civs[enemy].wei+=civs[i].wei*civs[i].neword*civs[i].level/civs[enemy].level*(randInt(10)*0.01+0.1)*civs[enemy].tec;civs[enemy].tec+=civs[i].tec*civs[i].level*(randInt(20)*0.01+0.3)/civs[enemy].tec;}
                if(!civs[i].alive) break;if(maxk>civs[i].level*10) break;
            }
        }
        if(civs[i].alive && nodeActive[x]){vis[x]=i;civs[i].dir=x;}
    }
    
    // 成长+升级+成神
    for(let i=1;i<=N;i++){
        if(!civs[i].alive) continue;
        let c=civs[i];
        c.tec+=(randInt(20)*0.01+0.2)/c.level/c.tec;
        c.neword+=c.neword*c.tec*(randInt(20)*0.01+0.1)/c.level;
        c.wei+=c.level*c.neword*(randInt(20)+10)*0.1;
        while(c.tec>=2.3&&c.level<11){c.level++;c.tec/=2;c.neword+=c.level*randInt(3)*0.01;c.wei*=c.level;c.shield+=Math.sqrt(c.wei);log(`恭喜文明${i}晋升${c.level}级！`,'l-lvl');}
        if(c.level===11&&c.kill>12&&randInt(5)===2){killCiv(i);gods.push(i);log(`【世界广播】文明${i}成为神明！`,'l-god');}
    }
    updateStats(); draw();
}

// --- 初始化 & UI ---
function reset(){
    stop(); epoch=0; countCiv=N; gods=[]; battles={0:[]}; space={}; safeRadius=1.0;
    civs=[null];
    for(let i=1;i<=N;i++){
        civs.push({ord:randInt(30)*0.01+0.6,neword:0,wei:randInt(10)+randInt(10)+30,tec:randInt(99)*0.01+1,level:1,kill:0,dir:i*KCD+randInt(KCD)-1,shield:randInt(20)*0.1+3,alive:true,color:`hsl(${Math.random()*360},80%,60%)`});
        civs[i].neword=civs[i].ord;
    }
    // 初始化节点坐标 (力导向简化版)
    nodePos = [];
    for(let i=0;i<P*2;i++){
        const angle=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*0.8;
        nodePos[i]={x:r*Math.cos(angle), y:r*Math.sin(angle), vx:0, vy:0};
    }
    nodeActive = new Array(P*2).fill(true);
    buildMap(N*KCD, N*KCD*randInt(3));
    for(let i=1;i<=N;i++) if(nodeActive[civs[i].dir]) vis[civs[i].dir]=i;
    
    // 自适应初始视野
    cam={x:W/2,y:H/2,zoom:Math.min(W,H)/2.2};
    document.getElementById('log').innerHTML='<span style="color:#888">>>> 宇宙重启。缩圈倒计时开始...</span>';
    updateStats(); draw();
}

function toggle(){
    if(running){stop();return;}
    running=true;
    document.getElementById('bStart').textContent='⏸️ 暂停';
    document.getElementById('bStart').classList.add('on');
    timer=setInterval(tick,400);
}
function stop(){
    running=false; clearInterval(timer);
    document.getElementById('bStart').textContent='▶️ 继续';
    document.getElementById('bStart').classList.remove('on');
}

// --- 渲染 (含缩圈可视化) ---
window.onload=()=>{
    canvas=document.getElementById('c'); ctx=canvas.getContext('2d');
    resize(); window.addEventListener('resize',resize);
    canvas.addEventListener('mousemove',hover);
    canvas.addEventListener('mousedown',e=>{drag.active=true;drag.sx=e.clientX;drag.sy=e.clientY;drag.cx=cam.x;drag.cy=cam.y;document.getElementById('map').classList.add('dragging');});
    window.addEventListener('mouseup',()=>{drag.active=false;document.getElementById('map').classList.remove('dragging');});
    window.addEventListener('mousemove',e=>{if(drag.active){cam.x=drag.cx+(e.clientX-drag.sx);cam.y=drag.cy+(e.clientY-drag.sy);draw();}});
    canvas.addEventListener('wheel',e=>{e.preventDefault();const z=e.deltaY>0?0.9:1.1;cam.zoom=Math.max(50,Math.min(2000,cam.zoom*z));draw();},{passive:false});
    reset();
};
function resize(){const r=document.getElementById('map');canvas.width=r.clientWidth;canvas.height=r.clientHeight;W=canvas.width;H=canvas.height;cam.x=W/2;cam.y=H/2;cam.zoom=Math.min(W,H)/2.2;draw();}

function worldToScreen(wx,wy){return {x:(wx*cam.zoom)+cam.x, y:(wy*cam.zoom)+cam.y};}
function screenToWorld(sx,sy){return {x:(sx-cam.x)/cam.zoom, y:(sy-cam.y)/cam.zoom};}

function draw(){
    ctx.clearRect(0,0,W,H);
    
    // ✅ 绘制安全区边界
    const center=worldToScreen(0,0);
    const borderR=safeRadius*cam.zoom;
    ctx.beginPath();ctx.arc(center.x,center.y,borderR,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,50,50,${0.3+safeRadius*0.5})`;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=`rgba(255,0,0,${0.02*(1-safeRadius)})`;ctx.fill();
    
    // 绘制节点和连线
    for(let i=0;i<nodePos.length;i++){
        if(!nodePos[i]) continue;
        const p=worldToScreen(nodePos[i].x,nodePos[i].y);
        const active=nodeActive[i];
        
        // 连线
        ctx.strokeStyle=active?'#111':'#080808';ctx.lineWidth=1;
        for(let nb of adj[i]){
            if(nb>i && nodePos[nb]){
                const q=worldToScreen(nodePos[nb].x,nodePos[nb].y);
                ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
            }
        }
        // 节点
        ctx.beginPath();ctx.arc(p.x,p.y,active?2:1,0,Math.PI*2);
        ctx.fillStyle=active?'#333':'#111';ctx.fill();
    }
    
    // 绘制文明
    for(let i=1;i<=N;i++){
        if(!civs[i].alive || !nodeActive[civs[i].dir]) continue;
        const p=worldToScreen(nodePos[civs[i].dir].x,nodePos[civs[i].dir].y);
        ctx.beginPath();ctx.arc(p.x,p.y,4+civs[i].level,0,Math.PI*2);
        ctx.fillStyle=civs[i].color;ctx.shadowColor=civs[i].color;ctx.shadowBlur=10;
        ctx.fill();ctx.shadowBlur=0;
    }
}

function updateStats(){
    const pct=Math.round(safeRadius*100);
    document.getElementById('stats').textContent=`回合:${epoch}/${MAX_EPOCH} | 存活:${countCiv}/${N} | 安全区:${pct}%`;
}
const logBox=document.getElementById('log');
function log(t,c=''){const d=document.createElement('div');d.className=c;d.textContent=`[R${epoch}] ${t}`;logBox.appendChild(d);logBox.scrollTop=logBox.scrollHeight;}
function hover(e){
    const rect=canvas.getBoundingClientRect();
    const wp=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
    const tip=document.getElementById('tip');
    let found=null;
    for(let i=1;i<=N;i++){
        if(!civs[i].alive||!nodeActive[civs[i].dir]) continue;
        const np=nodePos[civs[i].dir];
        if(Math.hypot(np.x-wp.x,np.y-wp.y)<0.03){found=civs[i];break;}
    }
    if(found){
        tip.style.display='block';tip.style.left=(e.clientX+15)+'px';tip.style.top=(e.clientY+15)+'px';
        tip.innerHTML=`<b style="color:${found.color}">文明${civs.indexOf(found)}</b>\n等级:${found.level} | 科技:${found.tec.toFixed(2)}\n质量:${Math.floor(found.wei)} | 护盾:${found.shield.toFixed(1)}\n秩序:${found.neword.toFixed(2)} | 击杀:${found.kill}`;
    } else tip.style.display='none';
}
</script>
</body>
</html>
